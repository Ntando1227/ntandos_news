{% extends 'base.html' %}

{% block title %}
{{ page_title }}
{% endblock %}

{% block content %}
<div class="form-container">
    <h1>{{ page_title }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Save Publisher
        </button>

        <a
            class="button secondary-button"
            href="{% url 'publisher_list' %}"
        >
            Cancel
        </a>
    </form>
</div>
{% endblock %}

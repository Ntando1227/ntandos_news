{% extends 'base.html' %}

{% block title %}
Delete {{ object_type|title }}
{% endblock %}

{% block content %}
<div class="form-container">
    <h1>
        Delete {{ object_type|title }}
    </h1>

    <p>
        Are you sure you want to delete
        <strong>{{ object_name }}</strong>?
    </p>

    <p>
        This action cannot be undone.
    </p>

    <form method="post">
        {% csrf_token %}

        <button
            type="submit"
            class="danger-button"
        >
            Confirm Delete
        </button>

        <a
            class="button secondary-button"
            href="{% url cancel_url %}"
        >
            Cancel
        </a>
    </form>
</div>
{% endblock %}
